[project]
name = "rag-system"
version = "0.1.0"
description = "RAG System is a RAG-based enterprise search engine that allows users to search through their documents and get relevant information."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chonkie[table]>=1.6.2",
    "docling>=2.93.0",
    "fastapi>=0.100.0",
    "fastembed>=0.7.0",
    "httpx>=0.28.1",
    "img2table>=1.3.0",
    "llama-index-core>=0.14.20",
    "llama-index-embeddings-google-genai>=0.5.0",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-google-genai>=0.9.1",
    "llama-index-llms-openai>=0.7.5",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.0",
    "openai>=2.31.0",
    "pandas>=2.3.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "pymupdf-layout>=1.27.2.2",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.24",
    "qdrant-client>=1.17.1",
    "requests>=2.33.1",
    "snowflake-sqlalchemy>=1.9.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.56.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.23.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
py_version = 312

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["F401", "I001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
