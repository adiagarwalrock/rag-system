[project]
name = "rag-system"
version = "0.1.0"
description = "RAG System is a RAG-based enterprise search engine that allows users to search through their documents and get relevant information."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chonkie[table]>=1.6.2",
    "fastapi>=0.100.0",
    "fastembed>=0.7.0",
    "httpx>=0.28.1",
    "liteparse>=1.2.1",
    "llama-index-core>=0.14.20",
    "llama-index-embeddings-google-genai>=0.5.0",
    "llama-index-llms-google-genai>=0.9.1",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.0",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "pymupdf-layout>=1.27.2.2",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.24",
    "qdrant-client>=1.17.1",
    "requests>=2.33.1",
    "snowflake-sqlalchemy>=1.9.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.56.0",
    "uvicorn>=0.23.0",
]

[dependency-groups]
dev = ["black>=26.3.1", "isort>=8.0.1"]
