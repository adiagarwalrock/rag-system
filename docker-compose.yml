version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      RAW_DATA_DIR: /app/data/raw
      PARSED_ARTIFACTS_DIR: /app/artifacts/parsed
    volumes:
      - ./data/raw:/app/data/raw
      - ./artifacts/parsed:/app/artifacts/parsed
    depends_on:
      - qdrant
